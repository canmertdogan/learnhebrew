plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hebrew.learn'
    compileSdk 36

    defaultConfig {
        applicationId "com.hebrew.learn"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
