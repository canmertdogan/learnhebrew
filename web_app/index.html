          filtered = filtered.filter(e => e.src === filter);
        }
        // scoring
        let scored = filtered;
        if (tokens.length) {
          scored = filtered.map(e => ({ e, score: scoreEntry(e, tokens) })).filter(x => x.score > 0).sort((a, b) => b.score - a.score);
          // fuzzy fallback if too few results
          if (scored.length < 5) {
            const extra = filtered.map(e => ({ e, score: scoreEntry(e, tokens.map(t => t)) })).filter(x => x.score === 0);
            // try single-token fuzzy on hebrew/translit
            filtered.forEach(e => {
              if (scored.find(x => x.e === e)) return;
              const hN = e.hNorm || '';
              const tN = e.tNorm || '';
              let best = 0;
              for (const tok of tokens) {
                const qh = normHeb(tok); const ql = normLat(tok);
                if (qh && hN) { const d = levenshtein(hN, qh); if (d <= 2 && hN.length > 2) best = Math.max(best, 8 - d * 2); }
                if (ql && tN) { const d = levenshtein(tN, ql); if (d <= 2 && tN.length > 3) best = Math.max(best, 6 - d * 2); }
              }

        }
        // suggestions when no results
        this.state.dictSuggestions = [];
        if (q && filtered.length === 0) {

          const cands = all.map(e => {

            return { e, d: Math.min(d1, d2) };
          }).sort((a, b) => a.d - b.d).slice(0, 5);
          this.state.dictSuggestions = cands.filter(c => c.d <= Math.max(3, Math.floor(q.length * 0.6))).map(c => c.e);

    const TracePad = {
      strokes: [],
      currentStroke: null,
      showGhost: true,
      text: '',
      w: 360,
      h: 330,

      init(text, w, h) {
        this.text = text;
        this.w = w;
        this.h = h;
        this.strokes = [];
        this.currentStroke = null;
        this.showGhost = true;

        const canvas = document.getElementById('trace-canvas');
        if (!canvas) return;

        const getPos = (e) => {
          const r = canvas.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          return { x: clientX - r.left, y: clientY - r.top };
        };

        canvas.onpointerdown = (e) => {
          canvas.setPointerCapture(e.pointerId);
          this.currentStroke = [getPos(e)];
          this.strokes.push(this.currentStroke);
          document.getElementById('trace-feedback').textContent = '';
          this.draw();
        };
        canvas.onpointermove = (e) => {
          if (!this.currentStroke) return;
          this.currentStroke.push(getPos(e));
          this.draw();
        };
        canvas.onpointerup = () => { this.currentStroke = null; };
        canvas.onpointercancel = () => { this.currentStroke = null; };

        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(() => this.draw());
        }
        this.draw();
      },


      clear() {
        this.strokes = [];
        document.getElementById('trace-feedback').textContent = '';
        this.draw();
      },

      undo() {
        this.strokes.pop();
        this.draw();
      },

      toggleGhost() {
        this.showGhost = !this.showGhost;
        const btn = document.getElementById('ghost-toggle-btn');
        if (btn) btn.textContent = `👁 ${t(this.showGhost ? 'tr.stencilOn' : 'tr.stencilOff')}`;
        this.draw();
      },

      drawGhostText(ctx, color) {
        const fontSize = this.text.length === 1 ? Math.floor(this.h * 0.72) : Math.floor(this.h * 0.42);
        ctx.save();
        ctx.direction = 'rtl';
        ctx.font = `${fontSize}px "GveretLevin", sans-serif`;
        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.text, this.w / 2, this.h / 2);
        ctx.restore();
      },

      drawUserStrokes(ctx, color) {
        ctx.save();
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = this.text.length === 1 ? 14 : 10;
        for (const s of this.strokes) {
          if (!s.length) continue;
          if (s.length === 1) {
            ctx.beginPath();
            ctx.arc(s[0].x, s[0].y, ctx.lineWidth / 2, 0, Math.PI * 2);
            ctx.fill();
            continue;
          }
          ctx.beginPath();
          ctx.moveTo(s[0].x, s[0].y);
          for (let i = 1; i < s.length; i++) ctx.lineTo(s[i].x, s[i].y);
          ctx.stroke();
        }
        ctx.restore();
      },

      draw() {
        const canvas = document.getElementById('trace-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, this.w, this.h);

        // Scribe ruled lines on vellum
        ctx.save();
        ctx.strokeStyle = 'rgba(139, 38, 29, 0.24)';
        ctx.lineWidth = 1;
        ctx.setLineDash([8, 6]);
        ctx.beginPath();
        ctx.moveTo(20, this.h * 0.24); ctx.lineTo(this.w - 20, this.h * 0.24);
        ctx.moveTo(20, this.h * 0.76); ctx.lineTo(this.w - 20, this.h * 0.76);
        ctx.stroke();
        ctx.restore();

        if (this.showGhost) {
          this.drawGhostText(ctx, 'rgba(110, 82, 57, 0.34)');
        }
        // Deep sepia iron-gall ink for user strokes
        this.drawUserStrokes(ctx, '#261409');
      },

      check() {
        if (!this.strokes.length) return;
        const off1 = document.createElement('canvas');
        off1.width = this.w; off1.height = this.h;
        const c1 = off1.getContext('2d');
        this.drawGhostText(c1, '#000000');

        const off2 = document.createElement('canvas');
        off2.width = this.w; off2.height = this.h;
        const c2 = off2.getContext('2d');
        this.drawUserStrokes(c2, '#000000');

        const d1 = c1.getImageData(0, 0, this.w, this.h).data;
        const d2 = c2.getImageData(0, 0, this.w, this.h).data;

        const step = 4;
        const gw = Math.ceil(this.w / step);
        const gh = Math.ceil(this.h / step);
        const m1 = new Uint8Array(gw * gh);
        const m2 = new Uint8Array(gw * gh);

        for (let y = 0; y < gh; y++) {
          for (let x = 0; x < gw; x++) {
            const px = Math.min(this.w - 1, x * step);
            const py = Math.min(this.h - 1, y * step);
            const idx = (py * this.w + px) * 4 + 3;
            if (d1[idx] > 40) m1[y * gw + x] = 1;
            if (d2[idx] > 40) m2[y * gw + x] = 1;
          }
        }

        const dilate = (m, r) => {
          const out = new Uint8Array(gw * gh);
          for (let y = 0; y < gh; y++) {
            for (let x = 0; x < gw; x++) {
              if (!m[y * gw + x]) continue;
              for (let dy = -r; dy <= r; dy++) {
                for (let dx = -r; dx <= r; dx++) {
                  const ny = y + dy, nx = x + dx;
                  if (ny >= 0 && ny < gh && nx >= 0 && nx < gw) out[ny * gw + nx] = 1;
                }
              }
            }
          }
          return out;
        };

        const near1 = dilate(m1, 3);
        const near2 = dilate(m2, 3);
        let gCount = 0, gHit = 0, uCount = 0, uHit = 0;
        for (let i = 0; i < gw * gh; i++) {
          if (m1[i]) { gCount++; if (near2[i]) gHit++; }
          if (m2[i]) { uCount++; if (near1[i]) uHit++; }
        }
        const coverage = gCount ? gHit / gCount : 0;
        const precision = uCount ? uHit / uCount : 0;
        const score = coverage * precision;
        const stars = score >= 0.62 ? 3 : score >= 0.42 ? 2 : score >= 0.22 ? 1 : 0;
        Store.setStars(this.text, stars);

        const fb = document.getElementById('trace-feedback');
        const starIcons = '★'.repeat(stars) + '☆'.repeat(3 - stars);
        if (stars === 3) fb.textContent = `${starIcons} ${t('score.master', Math.round(score * 100))}`;
        else if (stars === 2) fb.textContent = `${starIcons} ${t('score.good', Math.round(score * 100))}`;
        else if (stars === 1) fb.textContent = `${starIcons} ${t('score.ok', Math.round(score * 100))}`;
        else fb.textContent = `${starIcons} ${t('score.low')}`;
      }
    };
